<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attrition Risk Console</title>
<style>
  :root {
    --bg: #F3F5F9;
    --panel: #FFFFFF;
    --ink: #1A2233;
    --muted: #5A6579;
    --line: #DDE2EC;
    --field: #F8FAFD;
    --brand: #2F6690;
    --brand-strong: #245279;
    --on-brand: #FFFFFF;
    --danger: #D8461E;
    --ok: #2A8A76;
    --focus: rgba(47, 102, 144, 0.35);
    --shadow: 0 1px 2px rgba(20, 30, 50, 0.06), 0 10px 28px rgba(20, 30, 50, 0.07);
    --radius: 14px;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D131E;
      --panel: #151D2C;
      --ink: #E7ECF6;
      --muted: #93A0B7;
      --line: #26324A;
      --field: #101827;
      --brand: #5B9BD5;
      --brand-strong: #7DB2E3;
      --on-brand: #0B1220;
      --danger: #F27A55;
      --ok: #4FBFA8;
      --focus: rgba(91, 155, 213, 0.4);
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    max-width: 1120px;
    margin: 0 auto;
    padding: 22px 20px 8px;
  }

  .brand { display: flex; align-items: center; gap: 12px; }

  .brand-mark {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--brand);
    color: var(--on-brand);
  }

  .brand h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  .brand p { margin: 0; color: var(--muted); font-size: 13px; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
  }

  .status::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
  }

  .status[data-state="online"]::before { background: var(--ok); }
  .status[data-state="offline"]::before { background: var(--danger); }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 20px;
    align-items: start;
    max-width: 1120px;
    margin: 0 auto;
    padding: 12px 20px 48px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  form.panel { padding: 8px 24px 24px; }

  fieldset {
    margin: 0;
    padding: 20px 0 4px;
    border: 0;
    border-bottom: 1px solid var(--line);
  }

  fieldset:last-of-type { border-bottom: 0; }

  legend {
    padding: 0;
    margin-bottom: 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--brand);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px 16px;
    margin-bottom: 16px;
  }

  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }

  .field label { font-size: 13px; font-weight: 600; }

  .field label code {
    margin-left: 6px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 400;
    color: var(--muted);
  }

  select,
  input[type="number"] {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--field);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  select:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  select:focus-visible,
  input:focus-visible,
  button:focus-visible,
  summary:focus-visible {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--focus);
  }

  input[aria-invalid="true"] { border-color: var(--danger); }

  .field-error {
    min-height: 0;
    margin: 0;
    color: var(--danger);
    font-size: 12px;
  }

  .derived {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }

  .chip {
    flex: 1 1 200px;
    padding: 12px 14px;
    border: 1px dashed var(--line);
    border-radius: 10px;
    background: var(--field);
  }

  .chip span { display: block; color: var(--muted); font-size: 12px; }
  .chip strong { font-size: 18px; font-variant-numeric: tabular-nums; }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: flex-end;
    padding-top: 20px;
  }

  button {
    height: 44px;
    padding: 0 18px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
  }

  button:hover { background: var(--field); }
  button:active { transform: translateY(1px); }

  button.primary {
    border-color: var(--brand);
    background: var(--brand);
    color: var(--on-brand);
  }

  button.primary:hover { background: var(--brand-strong); }
  button:disabled { opacity: 0.65; cursor: progress; }

  .result {
    position: sticky;
    top: 16px;
    padding: 22px;
  }

  .result h2 {
    margin: 0 0 4px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--brand);
  }

  .gauge { position: relative; margin: 8px auto 0; max-width: 280px; }
  .gauge svg { display: block; width: 100%; height: auto; overflow: visible; }

  .gauge-track,
  .gauge-fill {
    fill: none;
    stroke-width: 14;
    stroke-linecap: round;
  }

  .gauge-track { stroke: var(--line); }

  .gauge-fill {
    stroke: var(--ok);
    stroke-dasharray: 251.33;
    stroke-dashoffset: 251.33;
    transition: stroke-dashoffset 0.8s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.3s;
  }

  .result[data-flag="Yes"] .gauge-fill { stroke: var(--danger); }
  .gauge-mark { stroke: var(--muted); stroke-width: 2; }

  .gauge-readout {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 4px;
    text-align: center;
  }

  .gauge-readout strong {
    display: block;
    font-size: 34px;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .gauge-readout span { color: var(--muted); font-size: 12px; }

  .verdict {
    margin: 16px 0 6px;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--field);
    border: 1px solid var(--line);
    text-align: center;
    font-weight: 700;
  }

  .result[data-flag="Yes"] .verdict { color: var(--danger); }
  .result[data-flag="No"] .verdict { color: var(--ok); }
  .result[data-state="error"] .verdict { color: var(--danger); }

  .note { margin: 8px 0 0; color: var(--muted); font-size: 12.5px; }

  details {
    margin-top: 16px;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }

  summary { cursor: pointer; font-weight: 600; font-size: 13px; border-radius: 6px; }

  pre {
    margin: 10px 0 0;
    padding: 12px;
    max-height: 240px;
    overflow: auto;
    border-radius: 10px;
    background: var(--field);
    border: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.55;
  }

  .copy-row { margin-top: 10px; }
  .copy-row button { height: 36px; font-size: 13px; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .result { position: static; }
  }

  @media (max-width: 520px) {
    .topbar { flex-wrap: wrap; }
    form.panel { padding: 4px 16px 20px; }
    .actions button { flex: 1 1 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 17l5-5 4 4 8-9"></path>
        <path d="M15 7h5v5"></path>
      </svg>
    </div>
    <div>
      <h1>Attrition Risk Console</h1>
      <p>Telco customer churn scoring</p>
    </div>
  </div>
  <div class="status" id="apiStatus" data-state="checking">Checking API</div>
</header>

<main class="layout">
  <form class="panel" id="profileForm" novalidate>
    <div id="formBody"></div>
    <div class="actions">
      <button type="button" id="resetButton">Reset</button>
      <button type="button" id="sampleButton">Load sample</button>
      <button type="submit" class="primary" id="submitButton">Assess churn risk</button>
    </div>
  </form>

  <aside class="panel result" id="resultPanel" data-state="idle" aria-live="polite">
    <h2>Assessment</h2>
    <div class="gauge">
      <svg viewBox="0 0 200 118" role="img" aria-label="Churn probability gauge">
        <path class="gauge-track" d="M 20 100 A 80 80 0 0 1 180 100"></path>
        <path class="gauge-fill" id="gaugeFill" d="M 20 100 A 80 80 0 0 1 180 100"></path>
        <line class="gauge-mark" x1="100" y1="10" x2="100" y2="30"></line>
      </svg>
      <div class="gauge-readout">
        <strong id="probabilityText">--</strong>
        <span>churn probability</span>
      </div>
    </div>
    <div class="verdict" id="verdictText">Awaiting assessment</div>
    <p class="note" id="noteText">Complete the profile and run the assessment. A customer is flagged when the churn probability is above 50%.</p>
    <details>
      <summary>Request and response</summary>
      <pre id="payloadPreview">{}</pre>
      <pre id="responsePreview">{}</pre>
      <div class="copy-row"><button type="button" id="copyButton">Copy request JSON</button></div>
    </details>
  </aside>
</main>

<script>
(function () {
  "use strict";

  var YES_NO = ["Yes", "No"];
  var PHONE_DEPENDENT = ["multi_line"];
  var INTERNET_DEPENDENT = [
    "security_addon", "backup_addon", "protection_addon",
    "support_addon", "tv_streaming", "movie_streaming"
  ];
  var SERVICE_KEYS = [
    "phone_line", "multi_line", "security_addon", "backup_addon",
    "protection_addon", "support_addon", "tv_streaming", "movie_streaming"
  ];
  var GAUGE_LENGTH = 251.33;

  var GROUPS = [
    { id: "profile", title: "Customer profile" },
    { id: "services", title: "Services" },
    { id: "billing", title: "Contract and billing" }
  ];

  var FIELDS = [
    { key: "client_gender", label: "Gender", group: "profile", options: ["Female", "Male"], sample: "Female" },
    { key: "senior_flag", label: "Senior citizen", group: "profile", options: [["0", "No"], ["1", "Yes"]], sample: "0", numeric: true },
    { key: "has_partner", label: "Has partner", group: "profile", options: YES_NO, sample: "Yes" },
    { key: "has_dependents", label: "Has dependents", group: "profile", options: YES_NO, sample: "No" },

    { key: "phone_line", label: "Phone service", group: "services", options: YES_NO, sample: "Yes" },
    { key: "multi_line", label: "Multiple lines", group: "services", options: ["Yes", "No", "No phone service"], sample: "No" },
    { key: "internet_plan", label: "Internet plan", group: "services", options: ["DSL", "Fiber optic", "No"], sample: "Fiber optic" },
    { key: "security_addon", label: "Online security", group: "services", options: ["Yes", "No", "No internet service"], sample: "No" },
    { key: "backup_addon", label: "Online backup", group: "services", options: ["Yes", "No", "No internet service"], sample: "No" },
    { key: "protection_addon", label: "Device protection", group: "services", options: ["Yes", "No", "No internet service"], sample: "No" },
    { key: "support_addon", label: "Tech support", group: "services", options: ["Yes", "No", "No internet service"], sample: "No" },
    { key: "tv_streaming", label: "Streaming TV", group: "services", options: ["Yes", "No", "No internet service"], sample: "Yes" },
    { key: "movie_streaming", label: "Streaming movies", group: "services", options: ["Yes", "No", "No internet service"], sample: "Yes" },

    { key: "contract_term", label: "Contract", group: "billing", options: ["Month-to-month", "One year", "Two year"], sample: "Month-to-month" },
    { key: "ebilling", label: "Paperless billing", group: "billing", options: YES_NO, sample: "Yes" },
    { key: "payment_mode", label: "Payment method", group: "billing", wide: true, options: ["Electronic check", "Mailed check", "Bank transfer (automatic)", "Credit card (automatic)"], sample: "Electronic check" },
    { key: "tenure_months", label: "Tenure (months)", group: "billing", type: "number", min: 1, max: 120, step: 1, sample: "5", integer: true },
    { key: "monthly_fee", label: "Monthly fee", group: "billing", type: "number", min: 0, step: 0.05, sample: "80.5" },
    { key: "total_billed", label: "Total billed", group: "billing", type: "number", min: 0, step: 0.05, sample: "402.5" }
  ];

  var controls = {};
  var errorNodes = {};
  var lastPayload = null;

  var form = document.getElementById("profileForm");
  var formBody = document.getElementById("formBody");
  var resultPanel = document.getElementById("resultPanel");
  var gaugeFill = document.getElementById("gaugeFill");
  var probabilityText = document.getElementById("probabilityText");
  var verdictText = document.getElementById("verdictText");
  var noteText = document.getElementById("noteText");
  var payloadPreview = document.getElementById("payloadPreview");
  var responsePreview = document.getElementById("responsePreview");
  var submitButton = document.getElementById("submitButton");
  var copyButton = document.getElementById("copyButton");
  var apiStatus = document.getElementById("apiStatus");

  var derivedNodes = {};

  function buildControl(field) {
    var wrapper = document.createElement("div");
    wrapper.className = "field" + (field.wide ? " wide" : "");

    var label = document.createElement("label");
    label.htmlFor = "f_" + field.key;
    label.textContent = field.label;
    var hint = document.createElement("code");
    hint.textContent = field.key;
    label.appendChild(hint);

    var control;
    if (field.type === "number") {
      control = document.createElement("input");
      control.type = "number";
      control.inputMode = field.integer ? "numeric" : "decimal";
      control.min = field.min;
      if (field.max !== undefined) control.max = field.max;
      control.step = field.step;
    } else {
      control = document.createElement("select");
      field.options.forEach(function (option) {
        var node = document.createElement("option");
        node.value = Array.isArray(option) ? option[0] : option;
        node.textContent = Array.isArray(option) ? option[1] : option;
        control.appendChild(node);
      });
    }
    control.id = "f_" + field.key;
    control.name = field.key;

    var error = document.createElement("p");
    error.className = "field-error";
    error.id = "e_" + field.key;
    control.setAttribute("aria-describedby", error.id);

    wrapper.appendChild(label);
    wrapper.appendChild(control);
    wrapper.appendChild(error);

    controls[field.key] = control;
    errorNodes[field.key] = error;
    return wrapper;
  }

  function buildForm() {
    GROUPS.forEach(function (group) {
      var fieldset = document.createElement("fieldset");
      var legend = document.createElement("legend");
      legend.textContent = group.title;
      fieldset.appendChild(legend);

      var grid = document.createElement("div");
      grid.className = "grid";
      FIELDS.filter(function (f) { return f.group === group.id; })
        .forEach(function (f) { grid.appendChild(buildControl(f)); });
      fieldset.appendChild(grid);

      if (group.id === "billing") {
        var derived = document.createElement("div");
        derived.className = "derived";
        [
          { key: "mean_monthly_fee", label: "Average monthly fee" },
          { key: "active_service_count", label: "Active services" }
        ].forEach(function (item) {
          var chip = document.createElement("div");
          chip.className = "chip";
          var caption = document.createElement("span");
          caption.textContent = item.label + " (" + item.key + ", calculated)";
          var value = document.createElement("strong");
          value.textContent = "--";
          chip.appendChild(caption);
          chip.appendChild(value);
          derived.appendChild(chip);
          derivedNodes[item.key] = value;
        });
        fieldset.appendChild(derived);
      }

      formBody.appendChild(fieldset);
    });
  }

  function lockDependents(keys, locked, lockedValue) {
    keys.forEach(function (key) {
      var select = controls[key];
      Array.prototype.forEach.call(select.options, function (option) {
        if (option.value === lockedValue) option.disabled = !locked;
      });
      if (locked) {
        select.value = lockedValue;
      } else if (select.value === lockedValue) {
        select.value = "No";
      }
      select.disabled = locked;
    });
  }

  function syncDependencies() {
    lockDependents(PHONE_DEPENDENT, controls.phone_line.value === "No", "No phone service");
    lockDependents(INTERNET_DEPENDENT, controls.internet_plan.value === "No", "No internet service");
  }

  function numberValue(key) {
    var raw = controls[key].value;
    return raw === "" ? NaN : Number(raw);
  }

  function computeDerived() {
    var tenure = numberValue("tenure_months");
    var total = numberValue("total_billed");
    var average = tenure > 0 && isFinite(total) ? total / tenure : null;
    var services = SERVICE_KEYS.filter(function (key) {
      return controls[key].value === "Yes";
    }).length;
    return { mean_monthly_fee: average, active_service_count: services };
  }

  function refreshDerived() {
    var derived = computeDerived();
    derivedNodes.mean_monthly_fee.textContent =
      derived.mean_monthly_fee === null ? "--" : derived.mean_monthly_fee.toFixed(2);
    derivedNodes.active_service_count.textContent = String(derived.active_service_count);
  }

  function validate() {
    var firstInvalid = null;
    FIELDS.forEach(function (field) {
      var control = controls[field.key];
      var message = "";
      if (field.type === "number") {
        var value = numberValue(field.key);
        if (!isFinite(value)) {
          message = "Enter a number.";
        } else if (value < field.min) {
          message = "Must be at least " + field.min + ".";
        } else if (field.max !== undefined && value > field.max) {
          message = "Must be at most " + field.max + ".";
        } else if (field.integer && !Number.isInteger(value)) {
          message = "Use a whole number.";
        }
      }
      errorNodes[field.key].textContent = message;
      if (message) {
        control.setAttribute("aria-invalid", "true");
        if (!firstInvalid) firstInvalid = control;
      } else {
        control.removeAttribute("aria-invalid");
      }
    });
    return firstInvalid;
  }

  function buildPayload() {
    var derived = computeDerived();
    var payload = {};
    FIELDS.forEach(function (field) {
      var control = controls[field.key];
      if (field.type === "number") {
        payload[field.key] = Number(control.value);
      } else if (field.numeric) {
        payload[field.key] = Number(control.value);
      } else {
        payload[field.key] = control.value;
      }
    });
    payload.mean_monthly_fee = derived.mean_monthly_fee;
    payload.active_service_count = derived.active_service_count;
    return payload;
  }

  function setGauge(probability) {
    var offset = GAUGE_LENGTH * (1 - Math.max(0, Math.min(1, probability)));
    gaugeFill.style.strokeDashoffset = String(offset);
  }

  function showIdle() {
    resultPanel.dataset.state = "idle";
    delete resultPanel.dataset.flag;
    setGauge(0);
    probabilityText.textContent = "--";
    verdictText.textContent = "Awaiting assessment";
    noteText.textContent = "Complete the profile and run the assessment. A customer is flagged when the churn probability is above 50%.";
    payloadPreview.textContent = "{}";
    responsePreview.textContent = "{}";
    lastPayload = null;
  }

  function showResult(data) {
    var probability = Number(data.attrition_probability);
    var flagged = data.attrition_flag === "Yes";
    resultPanel.dataset.state = "done";
    resultPanel.dataset.flag = flagged ? "Yes" : "No";
    setGauge(probability);
    probabilityText.textContent = (probability * 100).toFixed(1) + "%";
    verdictText.textContent = flagged ? "Likely to churn" : "Likely to stay";
    noteText.textContent = flagged
      ? "This profile sits above the 50% threshold. Consider a retention offer, particularly around contract term and billing."
      : "This profile sits at or below the 50% threshold. No immediate retention action is indicated by the model.";
  }

  function showError(message, fields) {
    resultPanel.dataset.state = "error";
    delete resultPanel.dataset.flag;
    setGauge(0);
    probabilityText.textContent = "--";
    verdictText.textContent = "Assessment failed";
    noteText.textContent = fields && fields.length
      ? message + ": " + fields.join(", ")
      : message;
  }

  function clearErrors() {
    delete form.dataset.touched;
    FIELDS.forEach(function (field) {
      errorNodes[field.key].textContent = "";
      controls[field.key].removeAttribute("aria-invalid");
    });
  }

  function fillValues(values) {
    FIELDS.forEach(function (field) {
      controls[field.key].value = values[field.key];
    });
    syncDependencies();
    refreshDerived();
    clearErrors();
  }

  function sampleValues() {
    var values = {};
    FIELDS.forEach(function (field) { values[field.key] = field.sample; });
    return values;
  }

  function defaultValues() {
    var values = {};
    FIELDS.forEach(function (field) {
      values[field.key] = field.type === "number"
        ? ""
        : (Array.isArray(field.options[0]) ? field.options[0][0] : field.options[0]);
    });
    return values;
  }

  function onSubmit(event) {
    event.preventDefault();
    form.dataset.touched = "1";
    var firstInvalid = validate();
    if (firstInvalid) {
      firstInvalid.focus();
      return;
    }

    lastPayload = buildPayload();
    payloadPreview.textContent = JSON.stringify(lastPayload, null, 2);
    responsePreview.textContent = "{}";
    submitButton.disabled = true;
    submitButton.textContent = "Scoring...";

    fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(lastPayload)
    })
      .then(function (response) {
        return response.json().then(function (data) {
          return { ok: response.ok, data: data };
        });
      })
      .then(function (result) {
        responsePreview.textContent = JSON.stringify(result.data, null, 2);
        if (result.ok) {
          showResult(result.data);
        } else {
          showError(result.data.error || "Request rejected", result.data.missing_fields);
        }
        if (resultPanel.scrollIntoView) {
          resultPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      })
      .catch(function () {
        showError("Could not reach the API. Confirm the server is running.");
      })
      .then(function () {
        submitButton.disabled = false;
        submitButton.textContent = "Assess churn risk";
      });
  }

  function copyPayload() {
    var text = JSON.stringify(lastPayload || buildPayload(), null, 2);
    var done = function () {
      copyButton.textContent = "Copied";
      setTimeout(function () { copyButton.textContent = "Copy request JSON"; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () {});
    }
  }

  function checkApi() {
    fetch("/", { headers: { Accept: "application/json" } })
      .then(function (response) { return response.json(); })
      .then(function (data) {
        apiStatus.dataset.state = "online";
        apiStatus.textContent = "API " + data.status;
      })
      .catch(function () {
        apiStatus.dataset.state = "offline";
        apiStatus.textContent = "API unreachable";
      });
  }

  buildForm();
  fillValues(defaultValues());
  showIdle();

  form.addEventListener("submit", onSubmit);
  form.addEventListener("change", function () { syncDependencies(); refreshDerived(); });
  form.addEventListener("input", function () {
    refreshDerived();
    if (form.dataset.touched) validate();
  });
  document.getElementById("sampleButton").addEventListener("click", function () {
    fillValues(sampleValues());
  });
  document.getElementById("resetButton").addEventListener("click", function () {
    fillValues(defaultValues());
    showIdle();
  });
  copyButton.addEventListener("click", copyPayload);

  checkApi();
})();
</script>
</body>
</html>
